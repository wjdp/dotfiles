- name: Run ubuntu install
  when: distro == "ubuntu"
  include_tasks: ubuntu.yml

- name: Run cachyos install
  when: distro == "cachyos"
  include_tasks: cachyos.yml

- name: Check voxtype GPU backend
  stat:
    path: /usr/bin/voxtype
  register: voxtype_bin

- name: Enable voxtype Vulkan backend
  become: yes
  command: voxtype setup gpu --enable
  when: "'vulkan' not in (voxtype_bin.stat.lnk_target | default(''))"

- name: Add user to input group for evdev hotkey
  become: yes
  user:
    name: "{{ user }}"
    groups: input
    append: yes

- name: Ensure voxtype config directory exists
  file:
    path: "{{ dotfiles_user_home }}/.config/voxtype"
    state: directory
    mode: 0775

- name: Read private voxtype words
  set_fact:
    voxtype_private_words: >-
      {{ (lookup('file', voxtype_private_words_file, errors='ignore') | default('', true)).splitlines()
         | map('regex_replace', '#.*$', '') | map('trim') | select | list }}

- name: Build voxtype initial prompt
  set_fact:
    voxtype_initial_prompt: "{{ (voxtype_public_words + voxtype_private_words) | unique | join(', ') }}."

- name: Check for legacy voxtype config symlink
  stat:
    path: "{{ dotfiles_user_home }}/.config/voxtype/config.toml"
  register: voxtype_config

- name: Remove legacy voxtype config symlink
  file:
    path: "{{ dotfiles_user_home }}/.config/voxtype/config.toml"
    state: absent
  when: voxtype_config.stat.islnk | default(false)

- name: Render voxtype config
  template:
    src: config.toml.j2
    dest: "{{ dotfiles_user_home }}/.config/voxtype/config.toml"
    mode: 0600

- name: Ensure voxtype models directory exists
  file:
    path: "{{ voxtype_models_dir }}"
    state: directory
    mode: 0775

- name: Download voxtype models
  get_url:
    url: "{{ item.url }}"
    dest: "{{ voxtype_models_dir }}/{{ item.name }}"
    checksum: "{{ item.checksum }}"
  loop: "{{ voxtype_models }}"
  loop_control:
    label: "{{ item.name }}"
