# Launcher ($mod+d). Colours follow the waybar palette in ../waybar/style.css.

[main]
font=Noto Sans:size=11:style=Medium,NotoSansM NFP:size=11
prompt="❯ "
icon-theme=breeze-dark
terminal=ghostty -e
layer=overlay
width=45
lines=12
horizontal-pad=10
vertical-pad=8
inner-pad=8
line-height=26
# Ranks by match quality first; launch count only breaks ties
match-mode=fzf
match-counter=yes

[colors]
# Darker, less saturated than the bar navy so blue icons stand out
background=111827eb
# fg-dim
text=ccccccff
# fg
input=ffffffff
prompt=ffffffff
placeholder=ccccccaa
counter=ccccccaa
message=ccccccff
# warn, as the highlight for matched characters
match=ff9915ff
# accent
selection=08538cff
selection-text=ffffffff
selection-match=ff9915ff
border=08538cff

[border]
width=2
radius=0
selection-radius=0
